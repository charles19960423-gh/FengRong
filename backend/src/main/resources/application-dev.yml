# ==============================================
# 枫榕赏金酒馆 - 开发环境配置
# ==============================================

server:
  port: ${SERVER_PORT:8080}
  host: ${SERVER_HOST:0.0.0.0}

spring:
  application:
    name: fr-tavern
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fr_tavern}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      table-underline: true

logging:
  level:
    com.example.taskmanagement: ${LOG_LEVEL:DEBUG}
    org.mybatis: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:my-secret-key-for-jwt-signing-must-be-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000}

# 跨域配置
cors:
  allowed-origins: "http://localhost:8080,http://127.0.0.1:8080"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"