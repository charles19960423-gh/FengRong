# ==============================================
# 枫榕赏金酒馆 - 生产环境配置
# ==============================================

server:
  port: ${SERVER_PORT:8080}
  host: ${SERVER_HOST:0.0.0.0}

spring:
  application:
    name: fr-tavern
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fr_tavern}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 600000
      connection-timeout: 30000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      table-underline: true

logging:
  level:
    com.example.taskmanagement: INFO
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/fr-tavern.log
    max-size: 100MB
    max-history: 30

jwt:
  secret: ${JWT_SECRET:your-production-secret-must-be-very-secure}
  expiration: ${JWT_EXPIRATION:86400000}

# 跨域配置
cors:
  allowed-origins: "https://your-domain.com"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"

# 安全配置
security:
  csrf:
    enabled: true