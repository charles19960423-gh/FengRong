# ==============================================
# 枫榕赏金酒馆 - 主配置文件
# ==============================================

# 默认激活开发环境配置
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fr_tavern}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

# 服务器基础配置
server:
  port: ${SERVER_PORT:8080}

# MyBatis Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      table-underline: true

# JWT 配置
jwt:
  secret: ${JWT_SECRET:my-secret-key-for-jwt-signing-must-be-at-least-32-characters-long}
  expiration: ${JWT_EXPIRATION:86400000}